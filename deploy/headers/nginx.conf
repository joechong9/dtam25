# DTAM-MY security headers for nginx. Include inside the server { } block that serves the apps:
#   include /etc/nginx/snippets/dtam25-headers.conf;
# Each page also carries its own <meta> Content-Security-Policy; browsers enforce both.
# frame-ancestors only works as an HTTP header, which is why it is set here.

# Allow framing only by the same site (the dashboard embeds omr_scanner.html)
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# Camera: OMR scanner. Microphone: Part C speech-to-text (opt-in).
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
# Enable HSTS only once HTTPS works for the whole domain
add_header Strict-Transport-Security "max-age=31536000" always;
autoindex off;

# Pages: always revalidate so updates reach field devices
location ~* \.html$ {
    add_header Cache-Control "no-cache" always;
    # nginx does not inherit add_header into a location that sets its own, so repeat the security headers
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
# Vendor libraries are pinned by SRI hashes: cache for a year
location /vendor/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
